    <style>
      @-webkit-keyframes rotation {
        from {
          -webkit-transform: rotate(0deg);
        }
        to {
          -webkit-transform: rotate(360deg);
        }
      }

      @-moz-keyframes rotation {
        from {
          -moz-transform: rotate(0deg);
        }
        to {
          -moz-transform: rotate(360deg);
        }
      }

      @-o-keyframes rotation {
        from {
          -o-transform: rotate(0deg);
        }
        to {
          -o-transform: rotate(360deg);
        }
      }

      @keyframes rotation {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      html {
        background: #000;
      }

      body {
        font-family: arial;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        min-height: fill-available;
        min-height: 100vh;
        min-width: 100vw;
        background: radial-gradient(
          56.63% 56.63% at 50% 43.37%,
          transparent 0%,
          transparent 100%
        );
        background-color: black;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        place-items: center;
      }

      body.scrollingDisabled {
        overflow: hidden;
      }

      .emscripten {
        padding-right: 0;
        display: block;
      }

      div.emscripten {
        text-align: center;
        font-family: "Lucida Console", Monaco, monospace;
      }

      canvas.emscripten {
        display: none;
        background-color: black;
        position: flex;
        transition: opacity 5s ease-in;
        -webkit-transition: opacity 5s ease-in;
        opacity: 0;
        filter: blur(0) grayscale(0);
        image-rendering: optimizeSpeed;             
        image-rendering: -moz-crisp-edges;          
        image-rendering: -webkit-optimize-contrast; 
        image-rendering: -o-crisp-edges;            
        image-rendering: pixelated;                
        -ms-interpolation-mode: nearest-neighbor;   
      }

      canvas.active {
        animation-name: fadeIn;
        animation-duration: 2s;
        opacity: 1;
      }

      canvas.paused {
        animation-name: blur;
        animation-duration: 0.5s;
        filter: blur(2px) grayscale(1);
      }

      canvas.unpaused {
        animation-name: none;
      }

      canvas.animatedSizeTransitions {
        transition: width 0.3s ease, height 0.3s ease;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes blur {
        0% {
          filter: blur(0) grayscale(0);
        }
        100% {
          filter: blur(2px) grayscale(1);
        }
      }

      .spinner {
        height: 30px;
        width: 30px;
        -webkit-animation: rotation 0.8s linear infinite;
        -moz-animation: rotation 0.8s linear infinite;
        -o-animation: rotation 0.8s linear infinite;
        animation: rotation 0.8s linear infinite;
        border: 5px solid #bdff00;
        border-top: 5px solid #719900;
        border-radius: 100%;
      }

      #status {
        display: inline-block;
        vertical-align: top;
        font-weight: bold;
        color: white;
      }

      #progress {
        width: 250px;
        height: 10px;
        -webkit-appearance: none;
        appearance: none;
        padding: 5px;
      }

      progress[value]::-webkit-progress-bar {
        background-color: #8492a6;
        height: 10px;
        border-radius: 15px;
      }
  
      progress[value]::-webkit-progress-value {
        background-image: -webkit-linear-gradient(left, #719900, #bdff00);
        height: 10px;
        border-radius: 15px;
      }

      div.loading {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      div.loading > * {
        padding: 10px;
        margin: 10px;
      }

      .output-container {
        text-align: center;
        margin-top: auto;
      }
      .output-button {
        border: none;
        width: 200px;
        height: 25px;
        margin: 5px;
        border-radius: 5px;
        cursor: pointer;
        background-color: black;
        color: white;
        outline-color: #20c20e;
        outline-style: dashed;
        font-family: "Lucida Console", Monaco, monospace;
      }

      #output {
        display: none;
        height: 200px;
        background-color: black;
        color: white;
        font-family: "Lucida Console", Monaco, monospace;
        outline: none;
        border: none;
        padding: 0;
        width: 100%;
      }

      #message-container {
        display: none;
        min-height: 50px;
        background-color: rgba(20, 20, 20, 0.5);
        outline: none;
        border: none;
        padding: 0;
        width: 100%;
        position: absolute;
        top: 0;
      }

      #messages {
        margin-left: 50px;
        color: white;
        font-family: "Lucida Console", Monaco, monospace;
        outline: none;
        border: none;
        padding: 0;
      }

      img.qrCode {
         opacity: 1.0;
         width: 50%;
         height: 50%;
      }

      #pauseMenuContainer {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #pauseMenuContainer[hidden] {
        display: none !important;
        opacity: 0;
      }

      #pauseMenuBorder {
        background: linear-gradient(135deg, #FA1E4E, transparent 40%);
        padding: 1px;
        border-radius: 4px;
        clip-path: polygon(10.5px 0, 100% 0, 100% 100%, 0 100%, 0 10.5px);
        width: 70vw;
        max-width: 400px;
      }

      #pauseMenu {
        display: flex;
        flex-direction: column;
        padding: 60px 30px 60px 30px;
        background: linear-gradient(180deg, #2E273F 16.15%, rgba(46, 39, 63, 0.79) 56.25%, #2E273F 91.15%);
        border-radius: 4px;
        clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
        animation-name: fadeIn;
        animation-duration: 0.5s;
        opacity: 1;
      }

      #pauseMenu button {
        font-weight: 500;
        font-size: 17px;
        color: white;
        background: #FA1E4E;
        border: 1px solid #FA1E4E;
        border-radius: 6px;
        padding: 12px 24px;
        margin: 5px 0;
        -webkit-user-select: none;
        user-select: none;
      }

      #pauseMenu button#quitButton {
        background: #FA1E4E40;
      }

      #pauseMenu button:hover {
        filter: brightness(1.15);
      }

      #pauseMenu button:active {
        filter: brightness(0.85);
      }

      #pauseMenu button[hidden] {
        display: none;
      }
      
      /* Mobile controls */
      #mobileControls {
        display: none;
        position: absolute;
        bottom: 20px;
        width: 100%;
        justify-content: space-around;
        z-index: 10;
      }
      
      .dpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 5px;
      }
      
      .dpad-btn {
        width: 50px;
        height: 50px;
        background: rgba(50, 50, 50, 0.7);
        border: 2px solid #bdff00;
        border-radius: 5px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 24px;
        touch-action: manipulation;
      }
      
      .dpad-btn:active {
        background: rgba(100, 100, 100, 0.7);
      }
      
      .action-buttons {
        display: flex;
        gap: 20px;
      }
      
      .action-btn {
        width: 70px;
        height: 70px;
        background: rgba(50, 50, 50, 0.7);
        border: 2px solid #bdff00;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 24px;
        touch-action: manipulation;
      }
      
      .action-btn:active {
        background: rgba(100, 100, 100, 0.7);
      }
      
      /* Mobile controls visibility */
      @media (max-width: 768px) {
        #mobileControls {
          display: flex;
        }
      }

        <div class="dpad-btn" id="right">▶</div>
        <div class="dpad-btn"></div>

        <div class="dpad-btn"></div>

      <div class="action-buttons">
        <div class="action-btn" id="zBtn">Z</div>

      <div id="pauseMenuBorder">
        <div id="pauseMenu">
          <button id="resumeButton" onclick="resume()">
            Resume

            Quit

        </div>

    <script type="text/javascript">
      const CHANGE_ASPECT_RATIO = true;
      var bodyElement = document.getElementsByTagName("body")[0];
      var statusElement = document.getElementById("status");
      var progressElement = document.getElementById("progress");
      var spinnerElement = document.getElementById("spinner");
      var canvasElement = document.getElementById("canvas");
      var outputElement = document.getElementById("output");
      var outputContainerElement = document.getElementById("output-container");
      var qrElement = document.getElementById("QRCode");
      var qr2Element = document.getElementById("QR2Code");
      var qrButton = document.getElementById("QRButton");
      var qr2Button = document.getElementById("QR2Button");
      var pauseMenu = document.getElementById("pauseMenuContainer");
      var resumeButton = document.getElementById("resumeButton");
      var quitButton = document.getElementById("quitButton");

      const messageContainerElement = document.getElementById("message-container");
      const messagesElement = document.getElementById("messages");
      let rollbackMessages = [];

      let clearRollbackMessagesTimeoutId = -1;
      const showRollbackMessage = function (message) {
        let messages = "";
        rollbackMessages.push(message);
        rollbackMessages.forEach(m => messages += "<p>" + m + "</p>");

        messagesElement.innerHTML = messages;
        messageContainerElement.style.display = 'block';

        if (clearRollbackMessagesTimeoutId === -1) {
          clearTimeout(clearRollbackMessagesTimeoutId);
        }
        clearRollbackMessagesTimeoutId = setTimeout(clearRollbackMessages, 5000);
      };

      const clearRollbackMessages = function () {
        clearRollbackMessagesTimeoutId = -1;
        rollbackMessages = [];
        messageContainerElement.style.display = 'none';
      };
      
      // Mobile controls elements
      const upBtn = document.getElementById("up");
      const downBtn = document.getElementById("down");
      const leftBtn = document.getElementById("left");
      const rightBtn = document.getElementById("right");
      const zBtn = document.getElementById("zBtn");
      const xBtn = document.getElementById("xBtn");
      
      // Key state tracking
      const keyState = {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false,
        KeyZ: false,
        KeyX: false
      };
      
      // Mobile control event handlers
      function setupMobileControls() {
        // Directional buttons
        const handleDirection = (direction, state) => {
          const key = 
            direction === 'up' ? 'ArrowUp' :
            direction === 'down' ? 'ArrowDown' :
            direction === 'left' ? 'ArrowLeft' : 'ArrowRight';
            
          keyState[key] = state;
          if (state) {
            const event = new KeyboardEvent('keydown', { key: key });
            document.dispatchEvent(event);
          } else {
            const event = new KeyboardEvent('keyup', { key: key });
            document.dispatchEvent(event);
          }
        };
        
        upBtn.addEventListener('touchstart', () => handleDirection('up', true));
        upBtn.addEventListener('touchend', () => handleDirection('up', false));
        upBtn.addEventListener('touchcancel', () => handleDirection('up', false));
        
        downBtn.addEventListener('touchstart', () => handleDirection('down', true));
        downBtn.addEventListener('touchend', () => handleDirection('down', false));
        downBtn.addEventListener('touchcancel', () => handleDirection('down', false));
        
        leftBtn.addEventListener('touchstart', () => handleDirection('left', true));
        leftBtn.addEventListener('touchend', () => handleDirection('left', false));
        leftBtn.addEventListener('touchcancel', () => handleDirection('left', false));
        
        rightBtn.addEventListener('touchstart', () => handleDirection('right', true));
        rightBtn.addEventListener('touchend', () => handleDirection('right', false));
        rightBtn.addEventListener('touchcancel', () => handleDirection('right', false));
        
        // Action buttons
        zBtn.addEventListener('touchstart', () => {
          keyState.KeyZ = true;
          const event = new KeyboardEvent('keydown', { key: 'z' });
          document.dispatchEvent(event);
        });
        zBtn.addEventListener('touchend', () => {
          keyState.KeyZ = false;
          const event = new KeyboardEvent('keyup', { key: 'z' });
          document.dispatchEvent(event);
        });
        zBtn.addEventListener('touchcancel', () => {
          keyState.KeyZ = false;
          const event = new KeyboardEvent('keyup', { key: 'z' });
          document.dispatchEvent(event);
        });
        
        xBtn.addEventListener('touchstart', () => {
          keyState.KeyX = true;
          const event = new KeyboardEvent('keydown', { key: 'x' });
          document.dispatchEvent(event);
        });
        xBtn.addEventListener('touchend', () => {
          keyState.KeyX = false;
          const event = new KeyboardEvent('keyup', { key: 'x' });
          document.dispatchEvent(event);
        });
        xBtn.addEventListener('touchcancel', () => {
          keyState.KeyX = false;
          const event = new KeyboardEvent('keyup', { key: 'x' });
          document.dispatchEvent(event);
        });
      }
      
      // Prevent scrolling on mobile when touching the game area
      canvasElement.addEventListener('touchstart', function(e) {
        e.preventDefault();
      }, { passive: false });
      
      canvasElement.addEventListener('touchmove', function(e) {
        e.preventDefault();
      }, { passive: false });
      
      canvasElement.addEventListener('touchend', function(e) {
        e.preventDefault();
      }, { passive: false });
      
      var loadprogress = 0;
        
      var startingHeight, startingWidth;
      var startingAspect;
      var Module = {
        preRun: [],
        postRun: [],
        print: (function () {
          var element = document.getElementById("output");
          if (element) element.value = ""; // clear browser cache
          return function (text) {
            if (text === "Starting WAD") {
              loadprogress += 1;
            }
      
            if (loadprogress === 1) {
              Module.setStatus(text);
            }
            else if (loadprogress >= 2) {
              Module.setStatus("");
            }
            
            if (arguments.length > 1)
              text = Array.prototype.slice.call(arguments).join(" ");
    
            console.log(text);
            if (text === "Entering main loop.") {
              // Focus the canvas for keyboard input
              canvasElement.focus();
              ensureAspectRatio();
              canvas.width = 1920;
              canvas.height = 1080;
            }
            if (element) {
              element.value += text + "\n";
              element.scrollTop = element.scrollHeight; 
            }
          };
        })(),
        printErr: function (text) {
          if (arguments.length > 1)
            text = Array.prototype.slice.call(arguments).join(" ");
          console.error(text);
        },
        canvas: (function () {
          var canvas = document.getElementById("canvas");
          return canvas;
        })(),
        setStatus: function (text) {
          if (!Module.setStatus.last)
            Module.setStatus.last = { time: Date.now(), text: "" };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return; 
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2]) * 100;
            progressElement.max = parseInt(m[4]) * 100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;

            if (!text) {
              spinnerElement.style.display = "none";
              canvasElement.style.display = "block";
              // Focus the canvas so that keyboard events work
              canvasElement.focus();
            }
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(
            left
              ? "Preparing... (" +
                  (this.totalDependencies - left) +
                  "/" +
                  this.totalDependencies +
                  ")"
              : "All downloads complete."
          );
        },
      };
      Module.setStatus("Downloading...");
      window.onerror = function (event) {
        Module.setStatus("Exception thrown, see JavaScript console");
        spinnerElement.style.display = "none";
        Module.setStatus = function (text) {
          if (text) Module.printErr("[post-exception status] " + text);
        };
      };

      if (typeof window === "object") {
        Module['arguments'] = window.location.search.substr(1).trim().split('&');
        if (!Module['arguments'][0]) {
          Module['arguments'] = [];
        }
      }
      
      var g_pWadLoadCallback = undefined;
      function setWadLoadCallback( _wadLoadCallback ) 
      {
        g_pWadLoadCallback = _wadLoadCallback;
      }

      var g_pAddAsyncMethod = -1;

      function setAddAsyncMethod( asyncMethod )
      {
        g_pAddAsyncMethod = asyncMethod;
      }

      var g_pJSExceptionHandler = undefined;

      function setJSExceptionHandler( exceptionHandler )
      {
        if (typeof exceptionHandler == "function") {
            g_pJSExceptionHandler = exceptionHandler;
        } 
      } 

      function hasJSExceptionHandler()
      {
        return (g_pJSExceptionHandler != undefined) && (typeof g_pJSExceptionHandler == "function");
      } 

      function doJSExceptionHandler( exceptionJSON )
      {
        if (typeof g_pJSExceptionHandler == "function") {
          var exception = JSON.parse( exceptionJSON );
          g_pJSExceptionHandler( exception );
        } 
      }

      function onFirstFrameRendered()
      {
          //console.log("First frame rendered!");
      }

      function onGameSetWindowSize(width,height)
      {
          if (startingHeight === undefined && startingWidth === undefined) {
              console.log("Initial window size set to width: " + width + ", height: " + height);

              startingHeight = height;
              startingWidth = width;
              startingAspect = startingWidth / startingHeight;
          }
      }
      
      // Calculate max dimensions based on viewport
      const maxHeight = window.innerHeight;
      const maxWidth = window.innerWidth;

      function ensureAspectRatio()
      {
        // Find the limiting dimension.
        var heightQuotient = startingHeight / maxHeight;
        var widthQuotient = startingWidth / maxWidth;

        if (heightQuotient > widthQuotient) {
          // Max out on height.
          newHeight = maxHeight;
          newWidth = newHeight * startingAspect;
        } else {
          // Max out on width.
          newWidth = maxWidth;
          newHeight = newWidth / startingAspect;
        }

        canvasElement.style.height = newHeight + "px";
        canvasElement.style.width = newWidth + "px";
      }
      
      // To Pause when it detects the Tab is inactive
      function pause() { // Don't change the name - GX Mobile calls it when the app becomes inactive.
        if (!canvasElement.classList.contains("active")) { // Wait for the canvas to load.
          return
        }
        
        GM_pause();
        pauseMenu.hidden = false;
        canvasElement.classList.add("paused");
      }
      
      // To Resume when it detects the Tab is Active
      function resume() {
        GM_unpause();
        pauseMenu.hidden = true;
        canvasElement.classList.remove("paused");
        canvasElement.classList.add("unpaused");
        enterFullscreenIfSupported();
        lockOrientationIfSupported();
      }

      function quitIfSupported() {
        if (window.oprt && window.oprt.closeTab) { /* GX Mobile API */
          window.oprt.closeTab();
        } else if (window.chrome && window.chrome.runtime && window.chrome.runtime.sendMessage) {
          window.chrome.runtime.sendMessage('mpojjmidmnpcpopbebmecmjdkdbgdeke', { command: 'closeTab' })
        }
      }

      function enterFullscreenIfSupported() {
        if (!window.oprt || !window.oprt.enterFullscreen) { /* GX Mobile API */
          return;
        }

        window.oprt.enterFullscreen();
        let viewStatus = GM_get_view_status();
        viewStatus.fullscreen = true;
        GM_set_view_status(viewStatus);
      }

      function lockOrientationIfSupported() {
        if (!window.oprt || !window.oprt.lockPortraitOrientation || !window.oprt.lockLandscapeOrientation) { /* GX Mobile API */
          return;
        }

        let viewStatus = GM_get_view_status();
        if (viewStatus.landscape === true && viewStatus.portrait === false) {
          window.oprt.lockPortraitOrientation();
        } else if (viewStatus.landscape === false && viewStatus.portrait === true) {
          window.oprt.lockPortraitOrientation();
        }
      }
      
      // Initialize audio context on user interaction
      function initializeAudioContext() {
        // Create a single AudioContext for the game
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!window.audioContextInstance) {
          window.audioContextInstance = new AudioContext();
          // Resume the context to start audio playback
          if (window.audioContextInstance.state === 'suspended') {
            window.audioContextInstance.resume();
          }
        }
      }
      
      // Set up event listeners for audio context
      document.addEventListener('click', initializeAudioContext);
      document.addEventListener('touchstart', initializeAudioContext);
      document.addEventListener('keydown', initializeAudioContext);
      
      const resizeObserver = new ResizeObserver(() => {
        window.requestAnimationFrame(ensureAspectRatio);
        setTimeout(() => window.requestAnimationFrame(ensureAspectRatio), 100);
      });
      resizeObserver.observe(document.body);
      
      // Disable Scrolling on Mobile
      if (/Android|iPhone|iPod/i.test(navigator.userAgent)) {
        bodyElement.className = "scrollingDisabled";
        canvasElement.classList.add("animatedSizeTransitions");
        outputContainerElement.hidden = true;
      }

      document.addEventListener("visibilitychange", (event) => {
        if (document.visibilityState != "visible") {
          pause();
        }
      });

      window.addEventListener("load", (event) => {
        if ((!window.oprt || !window.oprt.enterFullscreen) && (!window.chrome || !window.chrome.runtime || !window.chrome.runtime.sendMessage)) {
          quitButton.hidden = true;
        }
        
        // Setup mobile controls
        setupMobileControls();
      });

      setWadLoadCallback(() => {
        enterFullscreenIfSupported();
        lockOrientationIfSupported();
      });
